<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
    <title>AudioMax | Formulario de Pedido</title>
</head>

<body>

    <!-- Encabezado Principal y Menú de Navegación Global -->
    <header>
        <h1>AudioMax</h1>
        <p>11 Años de experiencia</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="checkout.html" class="activo">Realizar Pedido</a></li>
            <li><a href="inventario.html">Stock</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <!-- Contenido Principal del Formulario -->
    <main>
        <section id="seccion-checkout">
            <h2>Realizar Pedido de Instrumentos</h2>
            <p>Completa el siguiente formulario para procesar tu reserva o solicitud de compra.</p>

            <form id="formulario-pedido" action="#" method="POST" novalidate>

                <div class="grupo-campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Aarón Hernández" required autocomplete="name">
                    <span class="error" id="error-nombre"></span>
                </div>

                <div class="grupo-campo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@duoc.cl" required autocomplete="email">
                    <span class="error" id="error-email"></span>
                </div>

                <div class="grupo-campo">
                    <label for="telefono">Teléfono de Contacto:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+56912345678" required autocomplete="tel">
                    <span class="error" id="error-telefono"></span>
                </div>

                <div class="grupo-campo">
                    <label class="titulo-lista">Selecciona los productos y cantidades:</label>

                    <!-- Producto 1 -->
                    <div class="item-pedido">
                        <div class="info-item">
                            <input type="checkbox" id="check-guitarra" name="producto_guitarra">
                            <label for="check-guitarra"><strong>Guitarra Eléctrica Fender</strong> - $450.000</label>
                        </div>
                        <div class="cantidad-item">
                            <label for="cant-guitarra">Cant:</label>
                            <input type="number" id="cant-guitarra" name="cant_guitarra" min="1" max="10" value="1">
                        </div>
                    </div>

                    <!-- Producto 2 -->
                    <div class="item-pedido">
                        <div class="info-item">
                            <input type="checkbox" id="check-teclado" name="producto_teclado">
                            <label for="check-teclado"><strong>Teclado Sintetizador Roland</strong> - $620.000</label>
                        </div>
                        <div class="cantidad-item">
                            <label for="cant-teclado">Cant:</label>
                            <input type="number" id="cant-teclado" name="cant_teclado" min="1" max="10" value="1">
                        </div>
                    </div>

                    <!-- Producto 3 -->
                    <div class="item-pedido">
                        <div class="info-item">
                            <input type="checkbox" id="check-bateria" name="producto_bateria">
                            <label for="check-bateria"><strong>Batería Acústica Pearl</strong> - $780.000</label>
                        </div>
                        <div class="cantidad-item">
                            <label for="cant-bateria">Cant:</label>
                            <input type="number" id="cant-bateria" name="cant_bateria" min="1" max="10" value="1">
                        </div>
                    </div>

                    <!-- Producto 4 -->
                    <div class="item-pedido">
                        <div class="info-item">
                            <input type="checkbox" id="check-microfono" name="producto_microfono">
                            <label for="check-microfono"><strong>Micrófono Audio-Technica</strong> - $120.000</label>
                        </div>
                        <div class="cantidad-item">
                            <label for="cant-microfono">Cant:</label>
                            <input type="number" id="cant-microfono" name="cant_microfono" min="1" max="10" value="1">
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-enviar">Confirmar Pedido</button>
                <div id="mensaje-exito" class="exito"></div>
            </form>
        </section>
    </main>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 AudioMax. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
